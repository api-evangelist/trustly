- name: Trustly Lightbox
  surface: Trustly North America
  kind: hosted modal UI
  description: the secure hosted interface where bank selection, bank login (including bank OAuth / App-to-App), account selection and payment or data-sharing authorization (with the NACHA agreement) happen
  loader: https://trustly.one/start/scripts/trustly.js?accessId=YOUR_ACCESS_ID (sandbox.trustly.one in sandbox)
  api: Trustly.establish(establishData, TrustlyOptions), Trustly.addPanelListener(handler)
  callbacks: onReturn / onCancel plus returnUrl / cancelUrl redirects
- name: Select Bank Widget
  surface: Trustly North America
  kind: embedded JavaScript component
  description: renders the bank-selection list inline in the merchant page (preferred integration); bank ordering is server-sorted by device type and geography
  loader: same trustly.js library
  api: Trustly.selectBankWidget(establishData, TrustlyOptions); Trustly.renderButton(elementId, options) for Express Checkout and Sign-in buttons
