note: >-
  No rate limits, quotas, throttling behaviour or 429 handling are documented on either docs host, and the OpenAPI declares
  no 429 response or RateLimit-* headers. The only published throughput-shaped rules are on the webhook side (acknowledge
  within 3 seconds; retries every 5 minutes for 12 hours) and the recurring-payments cut-off (cancel before 8:30 PM GMT).
  Velocity limits exist but are risk controls, not API rate limits: extended reason codes 11XXX–14XXX report consumer and
  merchant amount/count velocity-limit declines (see errors/trustly-decline-codes.yml).
