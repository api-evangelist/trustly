core_objects:
- name: Transaction
  id_field: transactionId (Trustly-issued numeric string, also the objectId on events)
  merchant_key: merchantReference (unique per merchant and environment; the idempotency key)
  lifecycle: Established -> Authorized -> Processed -> Completed / Canceled / Denied / Failed / Expired / Reversed (see lifecycle statuses on
    the status-codes page)
- name: EstablishData
  role: the request/response object for POST /establish and the Lightbox; carries merchantId, accessId, paymentType, transactionType, amount/currency,
    customer, account, beneficiary, recurrence, verification, notificationUrl, returnUrl/cancelUrl and requestSignature
- name: Customer
  id_field: customerId (Trustly) and externalId (merchant)
  role: consumer profile shared across transactions; VIP tier and trust score fields
- name: Split token
  role: half of the encrypted bank credential blob returned on the Authorize event; stored by the merchant and sent back on capture/deposit; the
    other half stays with Trustly
- name: Event
  id_field: eventId
  role: webhook notification; objectId points at the transaction, parentObjectId at the parent authorization
- name: PaymentProvider
  id_field: paymentProviderId / fiCode
  role: a bank (financial institution) selectable in the Lightbox; GET /paymentProviders
