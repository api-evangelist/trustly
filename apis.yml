- name: Trustly Europe API
  description: JSON-RPC 1.1 API for Trustly Pay by Bank in Europe and the UK. Methods cover Deposit, Withdraw/AccountPayout,
    Refund, SelectAccount, RegisterAccount, VerifyAccount, Charge and recurring direct debit (Autogiro, BACS, SEPA via DirectDebitMandate/DirectDebit/DirectCredit
    and batch variants), local payment methods (Swish, iDEAL/Wero, MB Way, Bancontact), Verification of Payee, and reporting
    (AccountLedger, MerchantSettlement, GetWithdrawals, CurrentBalance, ClosingBalance). Every request is signed with the
    merchant's RSA private key and every response and notification is signed by Trustly; notifications (account, pending,
    credit, debit, cancel, kyc, payoutconfirmation, payoutfailed) are JSON-RPC calls back to the merchant's NotificationURL.
  humanURL: https://docs.trustly.com/api
  baseURL: https://api.trustly.com/1
