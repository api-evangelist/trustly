apis:
- name: Trustly North America API
  description: REST API (OpenAPI 3.1, 31 operations, 10 documented webhook events) for Trustly Pay by Bank in the United States
    and Canada. Establish and authorize a transaction through the Trustly Lightbox or Select Bank Widget, then capture, deposit,
    preauthorize, reclaim, refresh, cancel or refund it; send payouts; tokenize and verify bank accounts; retrieve account
    balances, users and summaries; pull Trustly ID identity data; manage customers and dispute recovery. HTTP Basic auth with
    accessId/accessKey plus RSA request signatures; sandbox and production share one contract.
  humanURL: https://amer.developers.trustly.com/api-reference/api
