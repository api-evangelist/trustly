aid: trustly
name: Trustly Group
description: Trustly is a Pay by Bank payments company operating two developer surfaces. Trustly Europe (Trustly Group AB,
  Stockholm, a licensed Swedish payment institution) exposes a JSON-RPC 1.1 API at api.trustly.com for deposits, withdrawals/payouts,
  refunds, account tokenisation (SelectAccount/RegisterAccount), recurring direct debit (Autogiro, BACS, SEPA), local methods
  (Swish, iDEAL, MB Way, Bancontact) and settlement/ledger reporting, with RSA-signed requests and notifications. Trustly
  North America (Trustly Inc., formerly PayWithMyBank) exposes a REST API at trustly.one/api/v1 for establishing and authorizing
  bank transactions, capture, deposit, payout, refund, account verification and tokenization, Trustly ID identity data and
  event-notification webhooks, documented with a public OpenAPI 3.1, an llms.txt and a hosted MCP docs server.
