environments:
- name: Trustly North America sandbox
  base_url: https://sandbox.trustly.one/api/v1
  production_url: https://trustly.one/api/v1
  js_library: https://sandbox.trustly.one/start/scripts/trustly.js
  native_sdk_switch: establishData["env"] = "sandbox" (production for live)
  deprecated_hosts: [https://sandbox.paywithmybank.com, https://paywithmybank.com]
  credentials: separate accessId/accessKey per environment; the same OpenAPI applies to both
  parity: supports all features of production; payment operations move no funds
  event_timing: some asynchronous notifications (payout processing) are batched every 300 seconds
- name: Trustly Europe test environment
  base_url: https://test.trustly.com/api/1
  production_url: https://api.trustly.com/1
  back_office: https://test.trustly.com/backoffice
  credentials: a separate test account with a different password from production, requested at sign-up; a separate RSA key pair per environment is recommended, and Trustly publishes distinct TEST and LIVE public keys
  parity: one simplified bank backend stands in for every bank; any login identifier in the right national format works and creates a randomised test person
  test_cases: after selecting the bank, "Set order options" exposes trigger scenarios for Deposit, Withdrawal and SelectAccount with mandate (test-environment only)
  tools:
  - name: Notification tool
    url: https://docs.trustly.com/api/notification-tool
    purpose: view the notifications Trustly sent for an OrderID
  - name: Signature tester
    url: https://docs.trustly.com/api/signature-tester
  - name: JSON validator
    url: https://docs.trustly.com/api/json-validator
  - name: API test tool
    url: https://docs.trustly.com/api/apitools
demo_banks:
  access: select a Demo Bank from the search bar inside the Trustly Lightbox or Select Bank Widget
  happy_path: any unique username with a password of three or more alphanumeric characters simulates a successful authorization with a standard checking/savings account
  guidance: use unique descriptive usernames per scenario (for example happy_path_test_01); avoid generic test/demo
  delay: username `Sleep` with the number of seconds as the password
  password_keyphrases:
    user_interaction_and_errors:
    - {password: NoEligibleAccounts, effect: no eligible accounts found for the user}
    - {password: LoginError, effect: wrong username or password}
    - {password: Unavailable, effect: bank site cannot be reached}
    - {password: AccountLocked, effect: user's bank account is locked}
    - {password: '2FA', effect: bank requests an MFA challenge (answer 'error' to simulate a wrong credential)}
    - {password: WrongCredentials, effect: general login retry scenario}
    - {password: SessionTimeout, effect: expired bank session}
    - {password: NotSupported, effect: user with no supported accounts (credit cards only)}
    conditional_data:
    - {password: 'Balance{xxx}', effect: account balance of xxx (for example Balance1000)}
    - {password: NotEnoughFunds, effect: single account with zero balance}
    - {password: TimeoutError, effect: connector sleeps at least one minute (system timeout)}
    - {password: ExpiredSplitToken, effect: authorization succeeds but later Refresh calls fail with an expired split token}
    - {password: AccFromUsername, effect: 'account number taken from the username pattern {prefix}_{accountnumber}'}
    - {password: AccNumberNull, effect: account number returns null}
    - {password: Virtual, effect: returns a valid Virtual Account Number (VAN)}
    decline_simulation:
    - {password: 'extendedreasoncode_<code>', effect: 'next capture is denied with paymentProviderTransaction.status SW054, reasonCode 1 and extendedReason.code <code> (for example extendedreasoncode_10000)'}
