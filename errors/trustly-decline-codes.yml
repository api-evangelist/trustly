  action: N/A
- code: SW054
  consumer_decline_code: Security Controls
  meaning: Suspicious transaction activity.
  consumer_messaging: 'Security Alert: We detected some unusual activity and as a result, this transaction was not completed.'
  action: Please try again later or use a different bank account. See **Payment Decline Codes** for details.
- code: SW055
  consumer_decline_code: Security Controls
  meaning: Negative data.
  consumer_messaging: 'Security Alert: We detected some unusual activity and as a result, this transaction was blocked.'
  action: Please contact Trustly's merchant support team if the user escalates. See **Payment Decline Codes** for details.
- code: SW056
  consumer_decline_code: Unsupported Account Type
  meaning: Invalid account.
  consumer_messaging: 'Invalid Account: To comply with Federal, state, or local regulations, Trustly does not currently support this type of account.'
  action: Please prompt the user to use a personal debitable account. See **Payment Decline Codes** for details.
- code: SW057
  consumer_decline_code: Expired Split Token
  meaning: Expired split token.
  consumer_messaging: 'Transaction unsuccessful: We''re sorry. The transaction could not be completed because of a technical error on the bank''s side.'
  action: Please prompt the user to log in again. See **Payment Decline Codes** for details.
- code: SW059
  consumer_decline_code: Security Controls
