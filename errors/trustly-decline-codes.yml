source: https://amer.developers.trustly.com/integrate/api-fundamentals/status-codes-and-type-definitions
envelope:
  field: paymentProviderTransaction.status on the transaction and on event notifications, with paymentProviderTransaction.reasonCode, .reasonCodeMessage and .extendedReason.code
    for the SW05x family; errorCode and statusMessage on Deny/Failed events
  sandbox_trigger: Demo Bank password `extendedreasoncode_<code>` (for example extendedreasoncode_10000) forces that extended reason on the next capture
masking: the Consumer Messaging column is the text Trustly expects merchants to show the payer; the extended reason codes (velocity limits, ML risk scores, blocklists,
  sanctions) are merchant-facing only and are not surfaced to the consumer beyond the generic Security Alert wording
