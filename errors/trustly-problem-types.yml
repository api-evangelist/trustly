problems:
- code: 100
  title: Internal error
  detail: an internal database exception occurred while processing the request
  remediation: retry later; contact support if persistent
- code: 150
  title: Remote error
  detail: a remote system (for example the consumer's bank interface) is down
  remediation: retry later
- code: 200
