  detail: one of the request parameters is invalid (for example an invalid amount format)
  remediation: fix the request
- code: 210
  title: Duplicate request
  detail: idempotency failure — a merchantReference already used on a transaction that reached Authorized/Processed/Completed
  remediation: treat as already-applied; do not retry with the same reference
- code: 300
