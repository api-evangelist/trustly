tools:
- name: searchDocs
  description: Search the documentation at https://amer.developers.trustly.com. Returns relevant doc passages with source URLs.
  readOnlyHint: true
  inputSchema:
    type: object
    required: [query]
    properties:
      query: {type: string, description: The search query to run against the docs}
