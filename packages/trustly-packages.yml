note: >-
  Two SDK families. Trustly North America (TrustlyInc GitHub org) ships the Lightbox/Select-Bank client SDKs: a hosted
  trustly.js, Android (Maven Central net.trustly), iOS (CocoaPods TrustlySDK + Swift Package Manager) and React Native
  (npm). Trustly Europe (trustly GitHub org) ships server-side JSON-RPC client libraries for Java, .NET, PHP and
  Node/TypeScript plus a legacy Android/iOS checkout SDK. Registry versions and dates were read from each registry's
  metadata endpoint on 2026-09-18.
