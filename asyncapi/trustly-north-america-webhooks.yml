europe:
  transport: JSON-RPC 1.1 notification calls POSTed to the merchant NotificationURL, RSA-signed by Trustly; merchant replies with a signed OK response
  notifications:
  - account
  - pending
  - credit
  - debit
  - cancel
  - kyc
  - payoutconfirmation
  - payoutfailed
  - payoutdowngraded
  docs: https://docs.trustly.com/api/notifications-overview
  tool: https://docs.trustly.com/api/notification-tool
